# Blueprint для Render: web-сервис из Dockerfile.
# Автодеплой по push выключен: выкатку инициирует GitHub Actions через Deploy Hook.
# DATABASE_URL задаётся в дашборде (sync: false) — подойдёт любой внешний Postgres,
# например бесплатный Neon: postgresql://user:pass@host/persons?sslmode=require
services:
  - type: web
    name: person-service
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /manage/health
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        sync: false
