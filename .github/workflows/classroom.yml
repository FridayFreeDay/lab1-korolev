name: GitHub Classroom Workflow

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

env:
  PYTHON_VERSION: "3.12"
  IMAGE_NAME: person-service
  POSTMAN_ENVIRONMENT: "postman/[inst][heroku] Lab1.postman_environment.json"
  RAILWAY_API_URL: "https://backboard.railway.com/graphql/v2"
  HEALTH_PATH: "/manage/health"
  HEALTH_TIMEOUT_SECONDS: "600"
  HEALTH_INTERVAL_SECONDS: "10"

jobs:
  build:
    name: Autograding
    runs-on: ubuntu-latest

    # Postgres поднимается рядом с runner'ом: тесты идут на той же СУБД,
    # что и в проде, а не на подменённом движке.
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: program
          POSTGRES_PASSWORD: test
          POSTGRES_DB: persons
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run unit tests
        env:
          TEST_DATABASE_URL: postgresql+psycopg://program:test@localhost:5432/persons
        run: pytest

      - name: Build Docker image
        run: docker build -t "${IMAGE_NAME}:${GITHUB_SHA}" .

      - name: Read service base url
        id: service
        run: |
          base_url=$(jq -r '.values[] | select(.key == "baseUrl") | .value' "${POSTMAN_ENVIRONMENT}")
          if [ -z "${base_url}" ] || [ "${base_url}" = "null" ]; then
            echo "::error::baseUrl не заполнен в ${POSTMAN_ENVIRONMENT}"
            exit 1
          fi
          echo "base_url=${base_url%/}" >> "${GITHUB_OUTPUT}"

      - name: Deploy to Railway
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
        run: |
          for name in RAILWAY_API_TOKEN RAILWAY_SERVICE_ID RAILWAY_ENVIRONMENT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Не задан secret ${name}"
              exit 1
            fi
          done

          payload=$(jq -n \
            --arg serviceId "${RAILWAY_SERVICE_ID}" \
            --arg environmentId "${RAILWAY_ENVIRONMENT_ID}" \
            --arg commitSha "${GITHUB_SHA}" \
            '{
              query: "mutation Deploy($serviceId: String!, $environmentId: String!, $commitSha: String!) { serviceInstanceDeployV2(serviceId: $serviceId, environmentId: $environmentId, commitSha: $commitSha) }",
              variables: { serviceId: $serviceId, environmentId: $environmentId, commitSha: $commitSha }
            }')

          response=$(curl --fail --silent --show-error \
            --request POST "${RAILWAY_API_URL}" \
            --header "Authorization: Bearer ${RAILWAY_API_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "${payload}")

          if echo "${response}" | jq -e '.errors' > /dev/null; then
            echo "::error::Railway отклонил запрос на деплой: $(echo "${response}" | jq -c '.errors')"
            exit 1
          fi

          deployment_id=$(echo "${response}" | jq -r '.data.serviceInstanceDeployV2 // ""')
          if [ -z "${deployment_id}" ]; then
            echo "::error::Railway не создал деплой: ${response}"
            exit 1
          fi
          echo "Запущен деплой ${deployment_id} для коммита ${GITHUB_SHA}"

      - name: Wait for deployed service
        env:
          BASE_URL: ${{ steps.service.outputs.base_url }}
          EXPECTED_COMMIT: ${{ github.event_name == 'push' && github.sha || '' }}
        run: |
          health_url="${BASE_URL}${HEALTH_PATH}"
          deadline=$(( $(date +%s) + HEALTH_TIMEOUT_SECONDS ))
          while true; do
            body=$(curl --fail --silent --max-time 15 "${health_url}" || true)
            if [ -n "${body}" ]; then
              if [ -z "${EXPECTED_COMMIT}" ]; then
                echo "Сервис доступен: ${body}"
                break
              fi
              deployed_commit=$(echo "${body}" | jq -r '.commit // ""')
              if [ "${deployed_commit}" = "${EXPECTED_COMMIT}" ]; then
                echo "Задеплоен коммит ${deployed_commit}"
                break
              fi
              echo "Задеплоен ${deployed_commit:-<неизвестно>}, ждём ${EXPECTED_COMMIT}"
            else
              echo "Сервис ещё недоступен: ${health_url}"
            fi
            if [ "$(date +%s)" -ge "${deadline}" ]; then
              echo "::error::Сервис не поднялся за ${HEALTH_TIMEOUT_SECONDS}s"
              exit 1
            fi
            sleep "${HEALTH_INTERVAL_SECONDS}"
          done

      - name: Run API Tests
        uses: matt-ball/newman-action@master
        with:
          collection: postman/[inst] Lab1.postman_collection.json
          environment: postman/[inst][heroku] Lab1.postman_environment.json
          delayRequest: 100
          reporters: '[ "cli" ]'

      - name: Autograding
        uses: education/autograding@v1
        continue-on-error: true

      - name: Github auto grader mark
        uses: Romanow/google-sheet-autograder-marker@v1.0
        with:
          google_token: ${{secrets.GOOGLE_API_KEY}}
          sheet_id: "1xkgjUX6Qmk7rdJG-QPOToav-HWWtthJjnShIKnw3oIY"
          homework_number: 1
          user_column: 'D'
          column_offset: 'F'
          mark: "'+"
